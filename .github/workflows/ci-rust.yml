name: CI

# Runs on every PR and on pushes to the default branch. The "on green CI, merge"
# rule depends on this workflow being the required status check — set it as
# required under Settings -> Branches -> branch protection rule for `main`.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Install Tauri Linux build dependencies
        # The desktop/ crate (Tauri) needs these system libs to compile at all,
        # not just to run — without them, cargo build/clippy/test fail on this
        # workspace even though nothing here is Tauri-specific.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        # Warnings fail the build. Note: this repo does not currently forbid
        # unwrap()/expect() in production code (see e.g. core/src/dedup.rs's
        # Regex::new(...).unwrap() calls) — "clean" here means no clippy lint
        # warnings, not adherence to a stricter unwrap-free standard.
        # (desktop/src-tauri deliberately uses parking_lot::Mutex specifically
        # to avoid needing a lock().unwrap() at every call site — see
        # desktop/src-tauri/src/state.rs — so it's no longer a good example here.)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features
