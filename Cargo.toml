[workspace]
resolver = "2"
members = ["core", "cli", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dirs = "6.0.0"
parking_lot = "0.12.5"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "cookies", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
toml = "1.1.4"
